<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistemas de Ecuaciones</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
    <nav>
        <ul>
            <li><a href="./raices.html"><h1>Sistemas de Ecuaciones</h1></a></li>
        </ul>
    </nav>

    <section class="pantalla_principal">
        <div class="card">
            <h2>Sistemas de Ecuaciones</h2>

            <div class="form-grid">
                <div>
                    <label>Filas y columnas</label>
                    <input id="matrix-size" type="number" min="2" max="6" value="3">
                </div>

                <div>
                    <label>Tolerancia</label>
                    <input id="tolerancia" value="0.0001">
                </div>

                <div>
                    <label>Iteraciones</label>
                    <input id="iteraciones" type="number" value="100">
                </div>
            </div>

            <div class="optimize-row">
                <button id="optimizar-btn" >Optimizar</button>
            </div>

            <h3>Matriz</h3>
            <div class="matrix-panel">
                <table class="matrix-table">
                    <tbody>
                        <tr>
                            <td ><input placeholder="x" ></td>
                            <td><input placeholder="y" ></td>
                            <td><input placeholder="z"></td>
                        </tr>
                        <tr>
                            <td ><input placeholder="x" ></td>
                            <td><input placeholder="y" ></td>
                            <td><input placeholder="z" ></td>
                        </tr>
                        <tr>
                            <td><input placeholder="x" ></td>
                            <td><input placeholder="y" ></td>
                            <td><input placeholder="z" ></td>
                        </tr>
                    </tbody>
                </table>
                <div class="equals-sign">=</div>
                <table class="ti-table">
                    <tbody>
                        <tr><td><input ></td></tr>
                        <tr><td><input ></td></tr>
                        <tr><td><input ></td></tr>
                    </tbody>
                </table>
            </div>

            <div class="button-grid" style="margin-top: 1.5rem;">
                <button id="calcular-btn"onclick="calcular_sistema()">Calcular</button>
            </div>
        </div>

        <div class="result card">
            <div class="result-card" id="result-container">
                <div class="result-row">
                    <label>x1</label>
                    <span class="result-value-large" id="result-0"></span>
                </div>
                <div class="result-row">
                    <label>x2</label>
                    <span class="result-value-large" id="result-1"></span>
                </div>
                <div class="result-row">
                    <label>x3</label>
                    <span class="result-value-large" id="result-2"></span>
                </div>
                <div class="result-row is-hidden">
                    <label>Estado</label>
                    <span class="result-value-large result-status" id="result-estado"></span>
                </div>
                <div class="button-grid">
                    <button class="metodo-btn " onclick="seleccionarMetodo('gauss_jordan', this)">Gauss-Jordan</button>
                    <button class="metodo-btn " onclick="seleccionarMetodo('gauss_seidel', this)">Gauss-Seidel</button>
                </div>
            </div>
        </div>
    </section>
    <script src="../js/main.js"></script>
</body>
</html>
